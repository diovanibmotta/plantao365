# Imagem única (API + front): PostgreSQL e um único serviço que serve a SPA e a API.
# Copie .env.example para .env e ajuste os valores. Uso:
#   docker compose -f docker-compose.single.yml build
#   docker compose -f docker-compose.single.yml run --rm app node dist/migrate.js up
#   docker compose -f docker-compose.single.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantao360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-plantao360}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_BASE_URL: ${APP_BASE_URL:?defina APP_BASE_URL no .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-plantao360}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plantao360}
      MANAGER_EMAILS: ${MANAGER_EMAILS:-}
      MASTER_USERNAME: ${MASTER_USERNAME:-}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PLUGIN_PUBLIC_KEYS: ${PLUGIN_PUBLIC_KEYS:-}
      PLUGIN_INSTALL_TOKEN: ${PLUGIN_INSTALL_TOKEN:-}
      PLUGINS_DIR: ${PLUGINS_DIR:-}
    ports:
      - '${WEB_PORT:-8080}:3000'
    restart: unless-stopped

volumes:
  db-data:
