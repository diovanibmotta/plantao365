apiVersion: v1
kind: ConfigMap
metadata:
  name: plantao365-config
  labels:
    app.kubernetes.io/name: plantao365
data:
  NODE_ENV: production
  PORT: '3000'
  LOG_LEVEL: info
  APP_BASE_URL: https://plantao.example.com
  MANAGER_EMAILS: gestor@example.com
  SESSION_TTL_SECONDS: '28800'
  OIDC_ISSUER: https://login.microsoftonline.com/TENANT_ID/v2.0
  OIDC_CLIENT_ID: CLIENT_ID
  OIDC_REDIRECT_URI: https://plantao.example.com/auth/callback
  # Só se o front estiver em outro domínio que a API (veja a wiki).
  # CORS_ALLOWED_ORIGINS: https://plantao.example.com
  SMTP_HOST: ''
  SMTP_PORT: '587'
  SMTP_SECURE: 'false'
  SMTP_FROM: ''
