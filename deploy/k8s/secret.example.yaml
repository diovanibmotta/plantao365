# Modelo. Não entra no kustomization: crie o Secret fora do Git
# (kubectl create secret, External Secrets, Sealed Secrets ou Vault).
# Senha do banco com caracteres especiais: aplique URL-encode na DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: plantao365-secret
  namespace: plantao365
type: Opaque
stringData:
  DATABASE_URL: postgres://USUARIO:SENHA@HOST_POSTGRES:5432/plantao360
  OIDC_CLIENT_SECRET: SEGREDO_DO_CLIENTE
  # Opcionais: remova se não usar.
  MASTER_USERNAME: ''
  MASTER_PASSWORD: ''
  SMTP_USER: ''
  SMTP_PASSWORD: ''
  # Token da CLI de plugins, 32+ caracteres (openssl rand -hex 32). Vazio: só um gestor logado instala.
  PLUGIN_INSTALL_TOKEN: ''
