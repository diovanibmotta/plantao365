apiVersion: apps/v1
kind: Deployment
metadata:
  name: plantao365-api
  labels:
    app.kubernetes.io/name: plantao365-api
    app.kubernetes.io/part-of: plantao365
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plantao365-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plantao365-api
        app.kubernetes.io/part-of: plantao365
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/diovanibmotta/plantao365-api
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: plantao365-config
            - secretRef:
                name: plantao365-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: plantao365-api
  labels:
    app.kubernetes.io/name: plantao365-api
    app.kubernetes.io/part-of: plantao365
spec:
  selector:
    app.kubernetes.io/name: plantao365-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: plantao365-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plantao365-api
