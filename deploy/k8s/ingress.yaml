# Origem da API para o CDN. O host é o da ORIGEM (ex.: origin-plantao.example.com),
# não o domínio público: o CDN encaminha /api/* e /auth/* para cá.
# Ajuste host, ingressClassName e o issuer do cert-manager ao seu cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plantao365
  labels:
    app.kubernetes.io/name: plantao365
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [origin-plantao.example.com]
      secretName: plantao365-tls
  rules:
    - host: origin-plantao.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: plantao365-api
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: plantao365-api
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: plantao365-api
                port:
                  name: http
